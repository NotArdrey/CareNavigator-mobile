project_id = "crhsbpkuteyqbxjpozrp"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.supabase.carenavigator://login-callback", "http://localhost:3000/**"]

[storage]
enabled = true

[realtime]
enabled = true

[functions.analyze-symptoms]
verify_jwt = true

[functions.care-workflows]
verify_jwt = true

[functions.analyze-medical-result]
verify_jwt = true

# Invoked by a trusted scheduler and protected by NOTIFICATION_DISPATCH_TOKEN.
[functions.dispatch-notifications]
verify_jwt = false

# This function validates administrator JWTs internally because its one-time
# bootstrap action must run before the first administrator can authenticate.
[functions.admin-users]
verify_jwt = false
